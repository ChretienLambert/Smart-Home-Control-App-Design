name: smart_home_control
description: A Smart Home Control App built with Flutter
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  go_router: ^14.2.7
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  flutter_svg: ^2.0.10+1
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  # MQTT Communication
  mqtt_client: ^10.0.0
  # Local Database
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.3
  path: ^1.8.3
  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  # JSON Serialization
  json_annotation: ^4.9.0
  # Utilities
  uuid: ^4.4.2
  intl: ^0.19.0
  # Network connectivity
  connectivity_plus: ^6.0.3
  # Local notifications
  flutter_local_notifications: ^17.2.2
  # Permissions
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Code generation
  build_runner: ^2.4.11
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
